name: Update Wanted Poster

on:
  schedule:
    - cron: "0 0 * * *"   # once a day, in case your avatar changes
  push:
    branches: [main]
    paths:
      - "assets/wanted-template.jpg"
  workflow_dispatch:
    inputs:
      name:
        description: "Name to print on the poster"
        default: "Love Yadav"
      bounty:
        description: "Optional bounty amount, e.g. 864,000,000-"
        default: ""

permissions:
  contents: write

jobs:
  update-wanted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pillow requests

      - name: Generate wanted poster
        env:
          GH_LOGIN: ${{ github.repository_owner }}
          NAME: ${{ inputs.name || 'Love Yadav' }}
          BOUNTY: ${{ inputs.bounty || '' }}
        run: python scripts/generate_wanted.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/wanted-poster.png
          git diff --staged --quiet || git commit -m "chore: refresh wanted poster"
          git push
